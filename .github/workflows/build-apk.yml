name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: APK debug para testes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout da branch selecionada
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK e aceitar licenças
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Instalar SDK usado pelo projeto
        shell: bash
        run: |
          set -euo pipefail
          SDK_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("android/gradle/libs.versions.toml", "rb"))["versions"]["compileSdk"])')
          sdkmanager "platforms;android-${SDK_VERSION}.0" "build-tools;${SDK_VERSION}.0.0" "platform-tools"

      - name: Instalar dependências
        run: npm ci

      - name: Validar catálogo e TypeScript
        run: |
          python3 -m unittest discover -s tests -v
          npm run test:back
          npm run test:templates
          npm run test:combat
          npx --no-install tsc --noEmit

      - name: Compilar aplicação web
        run: npm run build

      - name: Sincronizar Capacitor
        run: npx --no-install cap sync android

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --max-workers=2

      - name: Conferir APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK para download
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: bestiario-de-lendas-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Resumo
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          {
            echo '### APK debug do Bestiário de Lendas'
            echo
            echo "[Baixar artefato com app-debug.apk]($ARTIFACT_URL)"
            echo
            echo 'Extraia o ZIP e instale o APK no Android 7.0 ou superior (API 24).'
            echo 'O APK usa assinatura de depuração e se destina a testes.'
          } >> "$GITHUB_STEP_SUMMARY"
